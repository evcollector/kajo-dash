[platformio]
; kajo remains the default dashboard. fardriver_test and vesc_test are separate
; BLE test senders, each flashed onto a spare CYD.
default_envs = kajo

[env:kajo]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
monitor_speed = 115200
build_src_filter = -<*> +<main_lvgl.cpp> +<lvgl_app/>
extra_scripts = pre:tools/platformio_generate_layout.py
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  lvgl/lvgl @ 8.4.0
  h2zero/NimBLE-Arduino @ 2.5.1
; -O2 instead of the default -Os: LVGL's render loops gain 10-20%
build_unflags = -Os
build_flags =
  -O2
; Level 1 (errors only). The core and NimBLE log over the 115200 serial port
; during initArduino(), before setup() runs, and every line of that is boot
; time spent on the white splash. Serial.printf diagnostics in this firmware
; are explicit calls and are unaffected.
  -DCORE_DEBUG_LEVEL=1
  -DUSER_SETUP_LOADED=1
  -DUSE_HSPI_PORT=1
  -DILI9341_2_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  ; The boot splash and the calibration screens are rendered directly through
  ; TFT_eSPI, before or beside LVGL, and share these two bitmap faces. They are
  ; the only text faces the pre-LVGL screens need: the splash wordmark is vector
  ; artwork rather than type, so no large face has to be compiled in.
  ; TFT_eSPI gates every face behind its own define and silently skips glyphs
  ; from faces that are not compiled in -- font 4 was asked for here long before
  ; anything defined LOAD_FONT4, and drew nothing at all.
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
; Panel clock: 40 MHz is the reliable in-spec choice for this panel
; (80 showed minor artifacts; options are integer divisions of 80)
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=16000000
  -DLV_CONF_INCLUDE_SIMPLE=1
  -I${PROJECT_INCLUDE_DIR}
  ; Controller telemetry remains a single BLE central connection. Peripheral
  ; and broadcaster roles are compiled only for explicit, signed update mode;
  ; the controller link is disconnected before update advertising starts.
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=1
  -DCONFIG_BT_NIMBLE_MAX_CCCDS=1
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=12
  -DCONFIG_BT_NIMBLE_TRANSPORT_ACL_FROM_LL_COUNT=12

[env:fardriver_test]
extends = env:kajo
build_src_filter = -<*> +<fardriver_test/>
extra_scripts =
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  h2zero/NimBLE-Arduino @ 2.5.1

; The VESC sender answers requests instead of streaming, so it needs the same
; radio and panel support and nothing else from the dashboard either.
[env:vesc_test]
extends = env:kajo
build_src_filter = -<*> +<vesc_test/>
extra_scripts =
lib_deps =
  bodmer/TFT_eSPI @ 2.5.43
  h2zero/NimBLE-Arduino @ 2.5.1
