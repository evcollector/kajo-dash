<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-labelledby="title desc">
  <title id="title">CYD to VESC UART wiring</title>
  <desc id="desc">Four wires from the VESC COMM connector to the CYD. VESC 5V goes to VIN on the CYD power connector. VESC GND, RX/SDA and TX/SCL go to GND, IO22 and IO27 on the CYD CN1 connector, so the CYD transmits on IO22 into VESC RX and receives on IO27 from VESC TX. All other pins stay unconnected. A shielded four-core cable, such as a USB 2.0 cable with its plugs cut off, carries all four, with the shield connected to GND at the VESC end.</desc>
  <style>
    .bg { fill: #ffffff; stroke: #d0d7de; }
    .board { fill: #f5dc6a; stroke: #b8981f; }
    .hole { fill: #ffffff; stroke: #b8981f; }
    .ctrl { fill: #30353d; stroke: #1c2026; }
    .housing { fill: #fafbfc; stroke: #57606a; }
    .pin { fill: #c9d1d9; stroke: #57606a; }
    .pin-nc { fill: none; stroke: #afb8c1; stroke-dasharray: 3 2; }
    .t { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
    .dim { fill: #6e7781; }
    .on-dark { fill: #f3f4f6; }
    .on-dark-dim { fill: #9ba3ae; }
    .accent { fill: #ff7900; }
    .h1 { font-size: 20px; font-weight: 700; }
    .h2 { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .mono { font-family: ui-monospace, "Cascadia Mono", SFMono-Regular, Consolas, monospace; }
    .casing { fill: none; stroke: #1f2328; stroke-opacity: 0.18; stroke-width: 9; stroke-linecap: round; }
    .w { fill: none; stroke-width: 5; stroke-linecap: round; }
    .w-5v { stroke: #d1242f; }
    .w-gnd { stroke: #24292f; }
    .w-tx { stroke: #1a7f37; }
    .w-rx { stroke: #0969da; }
    .end-5v { fill: #d1242f; }
    .end-gnd { fill: #24292f; }
    .end-tx { fill: #1a7f37; }
    .end-rx { fill: #0969da; }
    .pill { fill: #ffffff; stroke-width: 1.5; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .shield { fill: #f6f8fa; stroke: #8c959f; stroke-dasharray: 2 2; }
    .warn { fill: #fff4e6; stroke: #ff7900; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .board { fill: #5c4f16; stroke: #b39b3a; }
      .hole { fill: #0d1117; stroke: #b39b3a; }
      .ctrl { fill: #262b33; stroke: #484f58; }
      .housing { fill: #161b22; stroke: #8b949e; }
      .pin { fill: #484f58; stroke: #8b949e; }
      .pin-nc { stroke: #484f58; }
      .t { fill: #e6edf3; }
      .dim { fill: #7d8590; }
      .casing { stroke: #000000; stroke-opacity: 0.5; }
      .w-5v { stroke: #ff6b6b; }
      .w-gnd { stroke: #c9d1d9; }
      .w-tx { stroke: #3fb950; }
      .w-rx { stroke: #58a6ff; }
      .end-5v { fill: #ff6b6b; }
      .end-gnd { fill: #c9d1d9; }
      .end-tx { fill: #3fb950; }
      .end-rx { fill: #58a6ff; }
      .pill { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; }
      .shield { fill: #161b22; stroke: #6e7681; }
      .warn { fill: #2a1a08; stroke: #ff7900; }
    }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="899" height="579" rx="12"/>
  <text class="t h1" x="40" y="42">CYD to VESC over UART</text>
  <text class="t small dim" x="40" y="62">Four wires. Pin order is the real COMM order, drawn with the 5V end up so no wires cross.</text>

  <!-- CYD board, back side -->
  <rect class="board" x="40" y="86" width="270" height="380" rx="12" stroke-width="2"/>
  <circle class="hole" cx="58" cy="104" r="6" stroke-width="1.5"/>
  <circle class="hole" cx="292" cy="104" r="6" stroke-width="1.5"/>
  <circle class="hole" cx="58" cy="448" r="6" stroke-width="1.5"/>
  <circle class="hole" cx="292" cy="448" r="6" stroke-width="1.5"/>
  <text class="t h2" x="64" y="130">CYD</text>
  <text class="t small" x="64" y="148">ESP32-2432S028R, back side</text>

  <!-- CYD power connector: VIN only -->
  <text class="t lbl" x="226" y="176" text-anchor="end">Power</text>
  <text class="t small dim" x="226" y="192" text-anchor="end">VIN only</text>
  <text class="t small dim" x="226" y="226" text-anchor="end">TX/RX here are</text>
  <text class="t small dim" x="226" y="242" text-anchor="end">USB serial: not</text>
  <text class="t small dim" x="226" y="258" text-anchor="end">for the link</text>
  <rect class="housing" x="238" y="156" width="64" height="124" rx="4" stroke-width="1.5"/>
  <rect class="pin" x="284" y="164" width="14" height="20" rx="2"/>
  <rect class="pin-nc" x="284" y="194" width="14" height="20" rx="2"/>
  <rect class="pin-nc" x="284" y="224" width="14" height="20" rx="2"/>
  <rect class="pin-nc" x="284" y="254" width="14" height="20" rx="2"/>
  <text class="t lbl mono" x="278" y="179" text-anchor="end">VIN</text>
  <text class="t small mono dim" x="278" y="209" text-anchor="end">TX</text>
  <text class="t small mono dim" x="278" y="239" text-anchor="end">RX</text>
  <text class="t small mono dim" x="278" y="269" text-anchor="end">GND</text>

  <!-- CYD CN1: the data link -->
  <text class="t lbl" x="226" y="334" text-anchor="end">CN1</text>
  <text class="t small dim" x="226" y="350" text-anchor="end">the link</text>
  <rect class="housing" x="238" y="310" width="64" height="124" rx="4" stroke-width="1.5"/>
  <rect class="pin" x="284" y="318" width="14" height="20" rx="2"/>
  <rect class="pin" x="284" y="348" width="14" height="20" rx="2"/>
  <rect class="pin" x="284" y="378" width="14" height="20" rx="2"/>
  <rect class="pin-nc" x="284" y="408" width="14" height="20" rx="2"/>
  <text class="t lbl mono" x="278" y="333" text-anchor="end">GND</text>
  <text class="t lbl mono" x="278" y="363" text-anchor="end">IO22</text>
  <text class="t lbl mono" x="278" y="393" text-anchor="end">IO27</text>
  <text class="t small mono dim" x="278" y="423" text-anchor="end">3.3V</text>

  <!-- VESC, COMM connector drawn 5V end up -->
  <rect class="ctrl" x="650" y="86" width="210" height="380" rx="12" stroke-width="2"/>
  <text class="t h2 on-dark" x="790" y="130" text-anchor="middle">VESC</text>
  <text class="t small on-dark-dim" x="790" y="148" text-anchor="middle">8-pin COMM</text>
  <rect class="housing" x="598" y="118" width="104" height="330" rx="4" stroke-width="1.5"/>
  <rect class="pin"    x="602" y="126" width="14" height="20" rx="2"/>
  <rect class="pin-nc" x="602" y="166" width="14" height="20" rx="2"/>
  <rect class="pin"    x="602" y="206" width="14" height="20" rx="2"/>
  <rect class="pin-nc" x="602" y="246" width="14" height="20" rx="2"/>
  <rect class="pin"    x="602" y="286" width="14" height="20" rx="2"/>
  <rect class="pin"    x="602" y="326" width="14" height="20" rx="2"/>
  <rect class="pin-nc" x="602" y="366" width="14" height="20" rx="2"/>
  <rect class="pin-nc" x="602" y="406" width="14" height="20" rx="2"/>
  <text class="t lbl mono" x="624" y="141">5V</text>
  <text class="t small mono dim" x="624" y="181">3.3V</text>
  <text class="t lbl mono" x="624" y="221">GND</text>
  <text class="t small mono dim" x="624" y="261">ADC1</text>
  <text class="t lbl mono" x="624" y="301">RX/SDA</text>
  <text class="t lbl mono" x="624" y="341">TX/SCL</text>
  <text class="t small mono dim" x="624" y="381">ADC2</text>
  <text class="t small mono dim" x="624" y="421">PowerSW</text>

  <!-- Wires: CYD pin centre x=298, VESC pin x=602; same control x keeps them apart -->
  <g>
    <path class="casing" d="M298 174 C 450 174, 450 136, 602 136"/>
    <path class="casing" d="M298 328 C 450 328, 450 216, 602 216"/>
    <path class="casing" d="M298 358 C 450 358, 450 296, 602 296"/>
    <path class="casing" d="M298 388 C 450 388, 450 336, 602 336"/>
    <path class="w w-5v"  d="M298 174 C 450 174, 450 136, 602 136"/>
    <path class="w w-gnd" d="M298 328 C 450 328, 450 216, 602 216"/>
    <path class="w w-rx"  d="M298 358 C 450 358, 450 296, 602 296"/>
    <path class="w w-tx"  d="M298 388 C 450 388, 450 336, 602 336"/>
    <circle class="end-5v" cx="291" cy="174" r="4.5"/><circle class="end-5v" cx="609" cy="136" r="4.5"/>
    <circle class="end-gnd" cx="291" cy="328" r="4.5"/><circle class="end-gnd" cx="609" cy="216" r="4.5"/>
    <circle class="end-rx" cx="291" cy="358" r="4.5"/><circle class="end-rx" cx="609" cy="296" r="4.5"/>
    <circle class="end-tx" cx="291" cy="388" r="4.5"/><circle class="end-tx" cx="609" cy="336" r="4.5"/>
  </g>

  <!-- Wire labels at each curve's midpoint -->
  <rect class="pill w-5v" x="400" y="144" width="100" height="22" rx="11"/>
  <text class="t small mono end-5v" x="450" y="159" text-anchor="middle" font-weight="700">VIN ← 5V</text>
  <rect class="pill w-gnd" x="410" y="261" width="80" height="22" rx="11"/>
  <text class="t small mono end-gnd" x="450" y="276" text-anchor="middle" font-weight="700">GND</text>
  <rect class="pill w-rx" x="392" y="316" width="116" height="22" rx="11"/>
  <text class="t small mono end-rx" x="450" y="331" text-anchor="middle" font-weight="700">IO22 TX → RX</text>
  <rect class="pill w-tx" x="392" y="351" width="116" height="22" rx="11"/>
  <text class="t small mono end-tx" x="450" y="366" text-anchor="middle" font-weight="700">IO27 RX ← TX</text>

  <!-- Cable: shielded four-core, drawn as a cross-section -->
  <circle class="shield" cx="358" cy="438" r="21" stroke-width="2.5"/>
  <circle class="end-5v" cx="351" cy="431" r="5"/>
  <circle class="end-gnd" cx="365" cy="431" r="5"/>
  <circle class="end-tx" cx="351" cy="445" r="5"/>
  <circle class="end-rx" cx="365" cy="445" r="5"/>
  <text class="t lbl" x="390" y="428">Shielded 4-core cable</text>
  <text class="t small dim" x="390" y="445">e.g. USB 2.0, plugs cut off</text>
  <text class="t small dim" x="390" y="461">Shield to GND at the VESC end</text>

  <!-- Notes -->
  <rect class="card" x="40" y="490" width="260" height="66" rx="8" stroke-width="1"/>
  <text class="t lbl" x="56" y="514">3.3 V logic on both sides</text>
  <text class="t small dim" x="56" y="534">No level shifter needed.</text>

  <rect class="card" x="320" y="490" width="260" height="66" rx="8" stroke-width="1"/>
  <text class="t lbl" x="336" y="514">VESC Tool</text>
  <text class="t small dim" x="336" y="534">App to Use: UART, 115200 baud</text>

  <rect class="warn" x="600" y="490" width="260" height="66" rx="8" stroke-width="1.5"/>
  <text class="t lbl" x="616" y="514"><tspan class="accent">▲</tspan> Before connecting USB</text>
  <text class="t small" x="616" y="534">unplug the 5 V lead from VIN.</text>
  <text class="t small dim" x="616" y="550">Dashed pins stay unconnected.</text>
</svg>
